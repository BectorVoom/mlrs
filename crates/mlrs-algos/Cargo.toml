[package]
name = "mlrs-algos"
version = "0.1.1"
edition = "2021"
description = "sklearn-compatible ML estimators for mlrs (Phase 4: LinearRegression, Ridge, PCA, TruncatedSVD)."

[dependencies]
mlrs-core = { path = "../mlrs-core" }
mlrs-backend = { path = "../mlrs-backend" }
# Feature-free generic CubeCL kernels (KERNEL-02): KernelDensity launches the six
# density-value maps + the div_by_row log-sum-exp rescale helper from
# mlrs-kernels::elementwise directly over the v1 distance base (D-08 — KD does NOT
# route through kernel_matrix). mlrs-kernels never pulls a backend runtime
# (Criterion 1); the concrete ActiveRuntime comes through mlrs-backend.
mlrs-kernels = { path = "../mlrs-kernels" }
# CubeCL: device-element trait surface (`Float` / `CubeElement`) the estimators
# are generic over (D-08). default-features=false so this crate never pulls a
# backend runtime — the active backend is selected through the `mlrs-backend`
# feature passthrough below (mlrs-backend OWNS `ActiveRuntime`).
cubecl = { workspace = true }
# Safe host<->device element bridging (`bytemuck::Pod` bound, D-08) for the
# materialize-at-accessor path (D-03).
bytemuck = { workspace = true }
thiserror = { workspace = true }
# Host-side structured warnings — the D-06 `force_alpha` clip emits a sklearn-
# parity warning when a too-small `alpha` is clipped to 1e-10 (the mlrs-backend
# reduce prim uses the same `log::warn!` convention). Parity depends only on the
# clipped numeric, not the warning text (Phase-11 A2).
log = { workspace = true }

# OPTIONAL row-container support for `model_selection::container` (MODSEL-RS-03).
# Both are OFF by default so the four backend wheels — which reach polars and
# numpy through their own PYTHON APIs, never through this crate — do not pay
# polars' build cost. A Rust-native consumer opts in with
# `features = ["ndarray", "polars"]`.
ndarray = { version = "0.16", optional = true }
# ONE polars pin, taken from the workspace (`default-features = false` is set
# there — the full default set drags in every IO format and the lazy-frame
# machinery, and neither `RowContainer` nor `mlrs_core::frame` needs any of it).
#
# It is the workspace pin rather than a local `version = "0.53"` because TWO
# consumers now share it: `model_selection::container`'s `RowContainer` impls
# (MODSEL-RS-03) and `mlrs_core::frame`'s DataFrame ingress (FSEL-01), the latter
# reached through this crate's `polars` feature for
# `tests/feature_selection_polars_test.rs`. Two different polars versions would
# compile BOTH and give the two modules mutually incompatible `DataFrame` types,
# so a frame built in a test could not be passed to `mlrs_core::frame` at all —
# a type error, not a subtle one, but only at the seam where the features meet.
#
# A regular optional dependency rather than a dev one because Cargo forbids an
# optional dev-dependency, and a NON-optional dev-dependency would compile polars
# for every `cargo test -p mlrs-algos` run — minutes of build for everyone not
# using it.
polars = { workspace = true, optional = true }

[dev-dependencies]
# Oracle harness (`load_npz`, `OracleCase`) + tolerance/sign-flip helpers the
# estimator tests consume. Reachable through the main `mlrs-core` dep, but named
# here so the test target is explicit about its oracle dependency.
mlrs-core = { path = "../mlrs-core" }
env_logger = { workspace = true }
# Compile-fail test harness (D-11) for the Wave-3 typestate gate that asserts a
# predict-before-fit does NOT compile. dtolnay crate (same author as the
# workspace `thiserror`/`syn`), legitimacy-audited in RESEARCH § Package
# Legitimacy Audit; dev-only, no build.rs/postinstall.
trybuild = "1.0.117"

# Backend selection passthrough. `mlrs-algos` owns NO runtime of its own; each
# feature forwards to the matching `mlrs-backend` feature so `--features cpu`/
# `--features rocm`/`--features wgpu`/`--features cuda` propagate to the backend
# that resolves the concrete `ActiveRuntime` (mirrors the backend's own feature
# block; D-07 gate = cpu(f64) + rocm(f32)). default-features stay off on the
# workspace cubecl pin (Security V12) — only these feature lines switch runtimes.
[features]
cpu = ["mlrs-backend/cpu"]
wgpu = ["mlrs-backend/wgpu"]
cuda = ["mlrs-backend/cuda"]
rocm = ["mlrs-backend/rocm"]

# Row-container adapters (MODSEL-RS-03). Named explicitly rather than relying on
# Cargo's implicit optional-dependency features so `cargo check --features
# ndarray` is a documented, checked configuration rather than an accident.
ndarray = ["dep:ndarray"]
# ONE `polars` feature serving both consumers, off by default:
#   * `model_selection::container`'s `RowContainer for DataFrame/Series`
#     (MODSEL-RS-03) — needs `dep:polars` in THIS crate;
#   * `mlrs_core::frame`'s DataFrame ingress (FSEL-01) — needs `mlrs-core`'s own
#     gate forwarded, which is what lets
#     `tests/feature_selection_polars_test.rs` reach both crates at once.
# Merged rather than kept as two features because they must select the SAME
# polars version (see the dependency comment above); two features could be
# enabled independently and only the pin stops them diverging, so naming one
# entry point makes that structural instead of incidental.
polars = ["dep:polars", "mlrs-core/polars"]
