[workspace]
resolver = "2"
members = [
    "crates/mlrs-core",
    "crates/mlrs-kernels",
    "crates/mlrs-backend",
    "crates/mlrs-algos",
    "crates/mlrs-py",
]

# The vendored safetensors fork (see `[patch.crates-io]` below) is NOT a
# workspace member: it is third-party code that must keep building exactly as it
# does upstream, not pick up this workspace's profiles, lints or feature
# unification. Excluding it also keeps `cargo test --workspace` from running
# safetensors' own suite on every mlrs run — `cargo test --manifest-path
# third_party/safetensors/Cargo.toml` runs it deliberately.
exclude = ["third_party/safetensors"]

# safetensors 0.8.0 + ONE patch: the `__metadata__` map is a `BTreeMap` rather
# than a `HashMap`, so a saved model is a deterministic function of its
# contents.
#
# Upstream serializes `__metadata__` straight out of a `std::collections::HashMap`
# (`Metadata::serialize` -> `map.serialize_entry("__metadata__", metadata)`),
# and `HashMap`'s iteration order comes from a randomly seeded hasher. Tensor
# entries are emitted through an index map and stay ordered, so the tensor
# payload is already stable — but the metadata keys shuffle between runs, which
# means saving the SAME model twice produces different bytes. That breaks
# content-addressing, deduplication, and byte-level diffing of model files.
#
# It cannot be worked around by a caller: `serialize` / `serialize_to_file` take
# the `HashMap` by value in their signatures, so there is no way to substitute
# an ordered map. Hence a patch rather than a local shim.
#
# `third_party/safetensors/README.md` carries the exact diff and the upstream
# status. Drop this block once the change lands in a published release.
#
# NOTE: `[patch]` is not inherited by downstream consumers of a published crate.
# Anything depending on mlrs from crates.io would resolve stock safetensors and
# lose determinism again; the mlrs wheels are built from this workspace, so they
# get the fix.
[patch.crates-io]
safetensors = { path = "third_party/safetensors" }

# Single source of truth for shared dependency versions (D-10: track latest).
# Verified latest on crates.io 2026-06-11 via `cargo search`.
[workspace.dependencies]
# CubeCL: device-kernel layer. default-features=false so the feature-free
# `mlrs-kernels` crate never pulls a backend runtime (Criterion 1 / Pitfall 5).
cubecl = { version = "0.10.0", default-features = false }

# Apache Arrow zero-copy interchange (mandated by CLAUDE.md).
arrow = "59"

# PyO3 binding layer for the Python wheels (Phase 6).
# PINNED to 0.28 (NOT the latest 0.29) — this is the ONE dep that overrides the
# "track latest" workspace policy above. arrow-59's `pyarrow` feature transitively
# pins pyo3 0.28.x, and only ONE pyo3 ABI may link into the `mlrs-py` cdylib;
# mixing 0.28 + 0.29 links two PyInit ABIs and crashes the wheel at import
# (D-09 / PY-05; RESEARCH 06 Pitfall 1). default-features=false: the
# `extension-module` + `abi3-py312` features are selected per-crate in mlrs-py.
pyo3 = { version = "0.28", default-features = false }

# Safe zero-copy &[T] <-> &[u8] transmutation for the Arrow -> CubeCL handoff.
bytemuck = { version = "1", features = ["derive"] }

# Typed error enums in library crates (D-07 / D-10).
thiserror = "2"

# Boundary error handling in mlrs-py and scripts-driven Rust (D-10).
anyhow = "1"

# Custom global allocator, wired only in mlrs-py (FOUND-09).
# `local_dynamic_tls`: mimalloc's bundled C library defaults to the initial-exec
# TLS model, which reserves a slot in the executable's STATIC TLS block. A wheel
# is `dlopen`'d into an already-running CPython, whose static TLS block is
# exhausted, so an initial-exec extension fails to import with
# `cannot allocate memory in static TLS block` (Plan 06-05 flagged this — the
# editable `.so` needed `LD_PRELOAD`). Building mimalloc with the
# local-dynamic TLS model makes the allocator `dlopen`-safe, so every backend
# wheel `import mlrs` works WITHOUT any preload (packaging-layer fix, PY-04).
mimalloc = { version = "0.1", features = ["local_dynamic_tls"] }

# polars DataFrame ingress/egress, OPTIONAL and off by default (FSEL-01).
# `mlrs-core`'s `polars` feature is the only thing that turns it on, and nothing
# in the workspace enables it transitively — polars is a very large tree and an
# mlrs caller working with `&[f32]` slices must not pay for it. PINNED to 0.54
# rather than `"0"` because it is a pre-1.0 crate whose minor bumps are breaking,
# and `default-features = false` because the frame conversion needs only the core
# DataFrame/Series types, not the IO, lazy-engine or SQL layers.
polars = { version = "0.54", default-features = false }

# .npz named-array reader for the oracle fixtures (D-02). npyz avoids the
# heavy `ndarray` dependency and reads into plain Vec<T>.
npyz = { version = "0.9", features = ["npz"] }

# Logging: dtype/backend selection (Criterion 4) and pool counters (D-05).
log = "0.4"
env_logger = "0.11"

# safetensors: the on-disk model-persistence container (NB-PERSIST prototype).
# Chosen over serde/bincode because the payload is almost entirely large numeric
# arrays: safetensors stores them as a raw little-endian blob behind an 8-byte
# length + JSON header, so a load is a `&[u8]` -> `&[F]` reinterpret with NO
# per-element decode, the file carries an explicit dtype tag (an f32-fitted model
# stays f32 on disk — half the bytes), and the result is readable by
# `safetensors.numpy.load_file` from Python without any mlrs code. It also has NO
# code-execution surface, unlike the pickle format sklearn persists through.
# `default-features = false` would drop `std`, which is what provides the
# streaming `serialize_to_file` writer, so the default `std` feature stays on.
safetensors = "0.8"
