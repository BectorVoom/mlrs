# CubeCL runtime configuration for the mlrs workspace.
#
# Found by `cubecl_common::config::from_current_dir()`, which walks UP from the
# process's working directory. `cargo test -p <pkg>` sets the cwd to the PACKAGE
# directory (e.g. `crates/mlrs-backend/`), so every workspace member's test
# binary walks up to this file. A binary launched from outside the repo will not
# see it and silently falls back to CubeCL defaults — there is no diagnostic for
# a missing or unparsed config.
#
# mlrs reads this file a second time, deliberately: `stream_cap::install_once()`
# calls `CubeClRuntimeConfig::from_current_dir().override_from_env()` so that the
# STREAM CAP (STREAM-CAP-01) can be merged into whatever this file says rather
# than replacing it. Because the `[streaming]` section below is absent,
# `max_streams` stays at cubecl's default and the cap still applies — see
# `crates/mlrs-backend/src/stream_cap.rs` rules 1-3. If you ever add
# `[streaming] max_streams` here, you are overriding that cap by design.

[compilation]
# The ON-DISK compiled-kernel cache. `CompilationConfig::cache` is an
# `Option<CacheConfig>` that defaults to `None` — i.e. OFF — so without this line
# every kernel is re-JITted in every process. (The AUTOTUNE cache is a separate
# field that is NOT an Option and is already on by default; `target/autotune`
# existing is not evidence that kernels are cached.)
#
# Which backends honour it (cubecl 0.10):
#   cubecl-hip  -> <root>/hip/<ver>/hip-kernel/  (device binaries)   [the ROCm win]
#   cubecl-cuda -> <root>/cuda/<ver>/ptx/        (PTX)
#   cubecl-wgpu -> only with the `spirv` feature
#   cubecl-cpu  -> never (in-memory HashMap only)
#
# WHY "target" AND NOT "global" — read this before changing it.
#
# `CacheConfig::Target` walks up to the NEAREST `Cargo.toml` and appends
# `target`, and cargo runs each test binary with cwd = the PACKAGE directory. So
# in a workspace it FRAGMENTS: measured here, it produced
# `crates/mlrs-backend/target/hip` AND `crates/mlrs-algos/target/hip` — separate
# caches with duplicate entries, neither of them the workspace target dir. Each
# package pays its own cold compile once, then runs warm.
#
# `"global"` (`~/.config/hip/<ver>/`) fixes the fragmentation and is the right
# answer for a repo that is the only thing using it — the sibling `lightgbm_rs`
# workspace picks it for exactly that reason. It is the WRONG answer HERE, for
# one reason: this repo auto-invalidates. `crates/mlrs-kernels/build.rs` deletes
# the cache whenever a `#[cube]` source changes (it has to — see below), and the
# global cache is a SINGLE shared `chunk0.cbor`, not per-project subdirectories.
# mlrs clearing it would throw away lightgbm_rs' kernels, and every other
# project's, on every kernel edit. Keeping the cache inside this tree keeps the
# invalidation's blast radius inside this tree too.
#
# `{ file = "..." }` is not a third option: `CacheConfig::File` is a raw
# `PathBuf`, so a relative path resolves against the package cwd and fragments
# just like "target", while an absolute one cannot be committed to git.
#
# MEASURED on this machine's gfx1151 (ROCm 7.1.5), kernel_matrix + laplacian:
#     cache off    1.83 s wall   (test bodies 1.07 s / 0.53 s)
#     cache warm   0.41 s wall   (test bodies 0.10 s / 0.09 s)   -> 4.5x
#
# ---------------------------------------------------------------------------
# !! THE CACHE DOES NOT NOTICE THAT YOU EDITED A KERNEL !!
# ---------------------------------------------------------------------------
# `KernelId::stable_hash()` (cubecl-runtime-0.10.0/src/id.rs:132) hashes
# `type_name`, `address_type`, `cube_dim`, `mode` and the `#[comptime]` `info`.
# It does NOT hash the kernel BODY or the generated IR. Editing a `#[cube]` fn
# without changing its name, generics or comptime arguments produces the SAME
# key, and the warm cache hands back the OLD binary.
#
# This is not a hypothesis. Sabotaging `rbf_map` to `F::exp(-gamma*x) + 1000`
# and changing nothing else, the SAME test binary:
#     warm cache -> kernel_matrix_all_kernels_f32 PASSES  (stale binary served)
#     cache clear-> kernel_matrix_all_kernels_f32 FAILS, max_abs = 1.0000000269e3
#
# So the common claim that this is safe because `KernelId` already separates
# `#[comptime]` specialisations is true about SPECIALISATIONS and false about
# REVISIONS. Two consequences for this repo specifically:
#
#   * `crates/mlrs-kernels/build.rs` clears the cache automatically whenever a
#     `#[cube]` source changes. That is what makes this config safe to enable at
#     all; without it, every kernel edit is a silent stale binary.
#   * A workspace `cargo clean` does NOT reach `crates/*/target/`.
#     `scripts/clear_kernel_cache.sh` does, and is the thing to run for the cases
#     the build script cannot see (a device compiler flag such as
#     HIPRTC_COMPILE_OPTIONS_APPEND, which the key also ignores; a cubecl bump).
#
# If you ever see "I changed the kernel and the numbers did not move", clear the
# cache FIRST and re-run before believing anything else.
cache = "target"
